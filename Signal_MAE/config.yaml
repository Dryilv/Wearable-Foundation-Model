# ==============================================================================
# Signal-MAE Training Configuration (基于原始信号 Token 划分)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Training & Optimization
# ------------------------------------------------------------------------------
train:
  epochs: 200

  batch_size: 512
  accum_iter: 1

  base_lr: 1.5e-4
  min_lr: 1.0e-6
  warmup_epochs: 10
  auto_scale_lr: True

  weight_decay: 0.05
  clip_grad: 3.0
  use_amp: True
  use_compile: False

  save_freq: 20
  save_dir: "./checkpoint"
  resume: null

# ------------------------------------------------------------------------------
# 2. Dataset Configuration
# ------------------------------------------------------------------------------
data:
  index_path: "train_index.json"
  signal_len: 1000
  num_workers: 16
  use_sliding_window: True
  window_stride: 500

# ------------------------------------------------------------------------------
# 3. Model Architecture (Signal-MAE)
# ------------------------------------------------------------------------------
model:
  # --- Input Processing ---
  patch_size: 50          # 每个 token 覆盖 50 个时间点

  # --- Transformer Encoder ---
  embed_dim: 768
  depth: 12
  num_heads: 12

  # --- Transformer Decoder ---
  decoder_embed_dim: 512
  decoder_depth: 8
  decoder_num_heads: 16

  # --- Masking Strategy ---
  mask_ratio: 0.75
